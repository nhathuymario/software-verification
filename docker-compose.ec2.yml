name: ltjava-ec2

services:
  redis:
    image: redis:7-alpine
    container_name: ltjava-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: ltjava-backend
    restart: unless-stopped
    env_file:
      - .env.ec2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: ltjava-frontend
    restart: unless-stopped
    env_file:
      - .env.ec2
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:4173"

volumes:
  redis_data:
